name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job reads only, except publish, which asks for write access on its own.
permissions:
  contents: read

# Runs on main finish in order so two publish jobs never push at once; pull request runs replace older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build on Linux (bash and PowerShell 7)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check build.sh with ShellCheck
        run: shellcheck build.sh

      - name: Check for inline scripts and inline event handlers
        # SharePoint Online blocks these under its Content Security Policy.
        run: |
          if grep -nE "on[a-z]+=|javascript:|document\.write\(|setAttribute\([[:space:]]*['\"]on|<script>" \
              src/sitenalyzer.js src/sitenalyzer.html src/sitenalyzer.html.txt; then
            echo "::error::Found inline script code in src/. SharePoint blocks it. Use addEventListener in sitenalyzer.js instead."
            exit 1
          fi

      - name: Build with bash
        run: |
          bash build.sh
          cp -r dist "$RUNNER_TEMP/dist-bash"

      - name: Build with PowerShell 7
        shell: pwsh
        run: ./build.ps1

      - name: Check that both builds wrote identical files
        run: |
          if ! diff -r "$RUNNER_TEMP/dist-bash" dist; then
            echo "::error::build.sh and build.ps1 wrote different files. Update both scripts so they match."
            exit 1
          fi

      - name: Save the built files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error

  build-windows:
    name: Build on Windows (Windows PowerShell 5.1)
    needs: build-linux
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Get the Linux build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist-linux

      - name: Check that the Windows build matches the Linux build
        shell: bash
        run: |
          if ! diff -r "$RUNNER_TEMP/dist-linux" dist; then
            echo "::error::Windows PowerShell 5.1 wrote different files than the Linux build. Check line endings and encodings in build.ps1."
            exit 1
          fi

  test:
    name: Browser tests
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the files built in this run
        run: rm -rf dist

      - name: Get the built files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test tools
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: tests
        run: npx playwright test

      - name: Save the test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 14

  publish:
    name: Commit rebuilt dist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-linux, build-windows, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with bash
        run: bash build.sh

      - name: Commit and push dist if it changed
        # Pushes made with GITHUB_TOKEN do not start another workflow run, so this cannot loop.
        run: |
          git add --all dist
          if git diff --cached --quiet; then
            echo "dist/ is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild dist from src"
          git push
